# The image tag is written by the release workflow (.github/workflows/release.yml), with yq, which drops blank lines:
# keep this file without them. Everything environment-specific (registry, analytics snippet) lives in the gitops
# values, which shouldn't set image.tag.
replicaCount: 1
image:
  repository: pauseai-es-presentaciones-static
  # <version>.<short sha>; "latest" until the first release.
  tag: 1.0.2.aa2c400
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
# HTML snippet injected before </head> via nginx sub_filter.
# Set from GitOps values, e.g.:
#   headSnippet: '<script defer data-domain="pauseai.es" src="https://plausible.example.com/js/plausible.js"></script>'
headSnippet: ''
# Nginx 301 redirects for legacy URLs.
# Each entry generates a `location = <from> { return 301 <to>; }` block.
# Set `prefix: true` to also redirect subpaths (e.g. /old/3 → /new/3).
redirects:
  - from: /presentaciones/2026-03-uma-mayores-55
    to: /presentaciones/riesgos-ia-uma-2026-03
    prefix: true
  # Bilingual restructure (2026-05): EN siblings folded into the canonical ES dir,
  # served under /<slug>/en/. See repo CLAUDE.md.
  - from: /presentaciones/ai-risks-uma-2026-03
    to: /presentaciones/riesgos-ia-uma-2026-03/en
    prefix: true
  - from: /presentaciones/mythos-ias-en-2026-05
    to: /presentaciones/mythos-ias-2026-05/en
    prefix: true
